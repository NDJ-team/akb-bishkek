<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD400" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFD400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="240" r="215" fill="url(#glow)"/>

  <!-- корпус -->
  <rect x="120" y="70" width="260" height="34" rx="6" fill="#1d1d1d" stroke="#3a3a3a"/>
  <rect x="112" y="104" width="276" height="300" rx="28" fill="url(#body)" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="122" y="114" width="256" height="280" rx="20" fill="url(#glass)"/>

  <!-- клеммы -->
  <rect x="148" y="84" width="18" height="34" rx="4" fill="#FFD400"/>
  <rect x="334" y="84" width="18" height="34" rx="4" fill="#333"/>
  <rect x="172" y="100" width="10" height="18" rx="2" fill="#333"/>

  <!-- молния -->
  <g>
    <path d="M268 150l-64 96h42l-14 72 72-108h-44l36-60z" fill="#FFD400"/>
    <path d="M268 150l-64 96h42l-14 72 72-108h-44l36-60z" fill="url(#body)" opacity="0"/>
  </g>

  <!-- текст -->
  <text x="250" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="6">AKB</text>
  <text x="250" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#9a9a9a" letter-spacing="10">БИШКЕК</text>

  <!-- индикатор заряда -->
  <rect x="152" y="360" width="196" height="10" rx="5" fill="#232323"/>
  <rect x="152" y="360" width="137" height="10" rx="5" fill="#FFD400"/>
</svg>
